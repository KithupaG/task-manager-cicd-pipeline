services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: BuduAmmo123!
      POSTGRES_DB: todo_db
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: kithupag/server:latest
    container_name: todo-backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: BuduAmmo123!
      DB_NAME: todo_db
    ports:
      - "5000:5000"

  frontend:
    image: kithupag/client:latest
    container_name: todo-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db-data:
