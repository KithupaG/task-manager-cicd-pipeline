<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222e;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --done: #34d399;
      --danger: #f87171;
      --text: #e2e0f0;
      --muted: #6b6980;
      --border: #2e2e3e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent2);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder { color: var(--muted); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 20px;
      transition: all 0.15s;
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
    }

    .btn-add:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn-add:active { transform: translateY(0); }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 999px;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      animation: slideIn 0.2s ease;
      transition: border-color 0.2s, opacity 0.2s;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task.done { opacity: 0.55; }
    .task.done .task-text { text-decoration: line-through; color: var(--muted); }

    .checkbox {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      background: transparent;
      padding: 0;
    }

    .checkbox.checked {
      background: var(--done);
      border-color: var(--done);
    }

    .checkbox svg { display: none; }
    .checkbox.checked svg { display: block; }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .btn-del {
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 1rem;
      border-radius: 6px;
      opacity: 0;
      transition: all 0.15s;
    }

    .task:hover .btn-del { opacity: 1; }
    .btn-del:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 0.95rem;
    }

    .empty span { display: block; font-size: 2rem; margin-bottom: 8px; }

    .progress-bar-wrap {
      height: 4px;
      background: var(--surface2);
      border-radius: 99px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--done));
      border-radius: 99px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

<header>
  <h1>TaskFlow</h1>
  <p>Simple. Fast. Productive.</p>
</header>

<div class="app">
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-done" style="color: var(--done)">0</div>
      <div class="stat-label">Done</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-left" style="color: var(--accent2)">0</div>
      <div class="stat-label">Remaining</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress" style="width:0%"></div>
  </div>

  <div class="input-row">
    <input id="task-input" type="text" placeholder="Add a new task…" maxlength="120" />
    <button class="btn-add" onclick="addTask()">Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
    <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
  </div>

  <div class="task-list" id="task-list"></div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
  let filter = 'all';
  let nextId = tasks.reduce((m, t) => Math.max(m, t.id), 0) + 1;

  const input = document.getElementById('task-input');
  input.addEventListener('keydown', e => e.key === 'Enter' && addTask());

  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: nextId++, text, done: false, created: Date.now() });
    input.value = '';
    save();
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) t.done = !t.done;
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const total = tasks.length;
    const done  = tasks.filter(t => t.done).length;
    const left  = total - done;
    const pct   = total ? Math.round((done / total) * 100) : 0;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-done').textContent  = done;
    document.getElementById('stat-left').textContent  = left;
    document.getElementById('progress').style.width   = pct + '%';

    const visible = tasks.filter(t =>
      filter === 'all'    ? true :
      filter === 'done'   ? t.done :
      !t.done
    );

    const list = document.getElementById('task-list');

    if (!visible.length) {
      list.innerHTML = `
        <div class="empty">
          <span>${filter === 'done' ? '🎉' : '📋'}</span>
          ${filter === 'done' ? 'Nothing done yet — keep going!' :
            filter === 'active' ? 'All tasks complete!' :
            'No tasks yet. Add one above!'}
        </div>`;
      return;
    }

    list.innerHTML = visible.map(t => `
      <div class="task ${t.done ? 'done' : ''}" id="task-${t.id}">
        <button class="checkbox ${t.done ? 'checked' : ''}" onclick="toggleTask(${t.id})" title="Toggle">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="#0f0f13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="task-text">${escHtml(t.text)}</span>
        <button class="btn-del" onclick="deleteTask(${t.id})" title="Delete">✕</button>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  render();
</script>
</body>
</html>
